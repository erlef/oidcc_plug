on:
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}

name: "Pull Request"

jobs:
  test:
    name: "Test"

    uses: $/.github/workflows/part_test.yml

  docs:
    name: "Docs"

    permissions:
      id-token: write
      contents: read
      attestations: write

    uses: $/.github/workflows/part_docs.yml
    with:
      attest: false
