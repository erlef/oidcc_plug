on:
  workflow_call:
    inputs:
      releaseName:
        required: true
        type: string
      stable:
        required: false
        type: boolean
        default: false

name: "Release"

jobs:
  create:
    name: Create Release

    runs-on: ubuntu-latest

    environment: release

    permissions:
      contents: write

    steps:
      - name: "Download Docs Artifact"
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: .

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.releaseName }}
        run: >-
          gh release create
          --repo "$GITHUB_REPOSITORY"
          --title "$RELEASE_NAME"
          --generate-notes
          ${{ !inputs.stable && '--prerelease' || '' }}
          "$RELEASE_NAME"
          docs.tar.gz*
